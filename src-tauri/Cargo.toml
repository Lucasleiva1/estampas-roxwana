[package]
name = "roxwana-biblioteca-visual"
version = "0.1.22"
description = "ROXWANA Biblioteca Visual"
authors = ["ROXWANA"]
edition = "2021"

[features]
default = []
commercial = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
wmi = "=0.17.3"

[dev-dependencies]
tempfile = "3"

# Las librerias externas se compilan optimizadas incluso en modo desarrollo.
# Sin esto, redimensionar imagenes grandes tarda decenas de segundos cada una.
[profile.dev.package."*"]
opt-level = 3
